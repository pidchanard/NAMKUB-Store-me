<main class="auth-page" *ngIf="!isLoading">
  <section class="auth-card">
    <div class="auth-copy">
      <p class="eyebrow">Welcome back</p>
      <h1>Login</h1>
      <p class="subtitle">เข้าสู่ระบบเพื่อเลือกซื้อน้ำดื่มและดูตะกร้าของคุณ</p>
    </div>

    <form class="auth-form" (ngSubmit)="onLogin()">
      <label class="field" for="username">
        <span class="bi bi-person-fill"></span>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Username"
          [(ngModel)]="username"
          maxlength="50"
          required
        />
      </label>

      <label class="field" for="password">
        <span class="bi bi-shield-lock-fill"></span>
        <input
          [type]="type"
          id="password"
          name="password"
          placeholder="Password"
          maxlength="50"
          [(ngModel)]="password"
          required
          (keyup.enter)="onLogin()"
        />
        <button class="icon-button" type="button" (click)="hideShowPass()" aria-label="Toggle password">
          <span [class]="eyeIcon"></span>
        </button>
      </label>

      <p *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </p>

      <button type="submit" class="primary-button">
        Login
      </button>

      <p class="auth-link">
        Don't have account?
        <a routerLink="/register">sign up</a>
      </p>
    </form>
  </section>
</main>
