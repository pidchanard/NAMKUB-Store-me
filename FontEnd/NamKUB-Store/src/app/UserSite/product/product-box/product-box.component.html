<ng-container *ngIf="products | async as productList">
  <div class="product-grid" *ngIf="productList.length; else noProducts">
    <div class="product-card" *ngFor="let product of productList">
      <div class="product-image">
        <img [src]="product.Product_Picture" alt="">
      </div>
      <div class="product-content">
        <h5>{{ product.Product_Name }}</h5>
        <div class="product-meta">
          <span>{{ product.Product_Size }} ml</span>
          <strong>{{ product.Product_Price }} บาท</strong>
        </div>
        <button class="add-cart-btn" type="button" (click)="addToCart(product)">
          <i class="bi bi-cart-plus"></i>
          ใส่รถเข็น {{ product.Product_Price }}.-
        </button>
      </div>
    </div>
  </div>

  <ng-template #noProducts>
    <div class="no-products">
      <i class="bi bi-search"></i>
      <h3>ไม่มีสินค้า</h3>
      <p *ngIf="searchText">ไม่พบสินค้าที่ตรงกับ "{{ searchText }}"</p>
    </div>
  </ng-template>
</ng-container>
