<nav class="navbar navbar-expand-lg navbar-light d-flex justify-content-between">
  <div class="d-flex align-items-center nav-left">
    <a class="navbar-brand" routerLink="/home">
      <img src="namkub.png" alt="logo namkub">
    </a>
    <ul class="navbar-nav">
      <li class="nav-item" routerLinkActive="active-nav-link">
        <a class="nav-link" routerLink="/home">Home</a>
      </li>
      <li class="nav-item" routerLinkActive="active-nav-link">
        <a class="nav-link" routerLink="/products">Products</a>
      </li>
      <li class="nav-item" routerLinkActive="active-nav-link">
        <a class="nav-link" routerLink="/contact">Contact Us</a>
      </li>
      <li class="nav-item" routerLinkActive="active-nav-link">
        <a class="nav-link" routerLink="/about-us">About Us</a>
      </li>
    </ul>
  </div>

  <form class="nav-search" role="search" (ngSubmit)="submitSearch()">
    <input
      class="form-control"
      type="search"
      placeholder="Search products"
      aria-label="Search"
      [value]="searchTerm"
      (input)="searchProducts($event)"
    >
    <button class="btn" type="submit" aria-label="Search">
      <i class="bi bi-search"></i>
    </button>
  </form>

  <div class="ms-auto d-flex align-items-center profile">
    <button class="theme-icon-btn" type="button" (click)="toggleDarkMode()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <i class="bi" [ngClass]="isDarkMode ? 'bi-sun' : 'bi-moon'"></i>
    </button>

    <span *ngIf="username" (click)="toggleProfilePopup()" class="nav-link user-name">
      {{ username }}
    </span>

    <div id="profilePopup" class="profile-popup" [ngStyle]="{ 'visibility': isProfilePopupVisible ? 'visible' : 'hidden' }">
      <div class="profile-popup-content">
        <img [src]="picture || defaultProfileImage" alt="" class="profile-image" (error)="useDefaultProfileImage()">
        <p>Hello {{ username }}</p>
        <button class="edit-profile-btn" routerLink="/edit-profile" (click)="editProfile()">Edit Profile</button>
      </div>
    </div>

    <a class="nav-link cart-link" routerLink="/cart" aria-label="Cart">
      <i class="bi bi-cart3"></i>
      <span class="cart-badge" *ngIf="(cartCount$ | async) as cartCount">{{ cartCount }}</span>
    </a>

    <a class="nav-link logout-link" (click)="logout()" href="/" aria-label="Logout">
      <i class="bi bi-box-arrow-right"></i>
    </a>
  </div>
</nav>
