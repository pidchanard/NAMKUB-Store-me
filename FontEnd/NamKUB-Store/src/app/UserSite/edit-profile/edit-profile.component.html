<div class="profile-page">
  <div class="profile-card">
    <button type="button" class="back-button" routerLink="/home">
      <i class="bi bi-arrow-left"></i>
      Back
    </button>

    <div class="profile-heading">
      <div>
        <h2>Edit Profile</h2>
        <p>Update your account details and profile photo.</p>
      </div>
      <div class="avatar-preview">
        <img [src]="profilePreview" alt="">
      </div>
    </div>

    <form [formGroup]="editprofileform" (ngSubmit)="onSubmit()" class="needs-validation">
      <div class="form-grid">
        <div class="form-group">
          <label for="firstname">First Name</label>
          <input type="text" id="firstname" formControlName="firstname" class="form-control"
            [ngClass]="{ 'is-invalid': editprofileform.get('firstname').invalid && editprofileform.get('firstname').touched }">
          <div class="invalid-feedback" *ngIf="editprofileform.get('firstname').invalid && editprofileform.get('firstname').touched">
            Please fill your firstname
          </div>
        </div>

        <div class="form-group">
          <label for="lastname">Last Name</label>
          <input type="text" id="lastname" formControlName="lastname" class="form-control"
            [ngClass]="{ 'is-invalid': editprofileform.get('lastname').invalid && editprofileform.get('lastname').touched }">
          <div class="invalid-feedback" *ngIf="editprofileform.get('lastname').invalid && editprofileform.get('lastname').touched">
            Please fill your lastname
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="text" id="phone" formControlName="phone" class="form-control"
            [ngClass]="{ 'is-invalid': editprofileform.get('phone').invalid && editprofileform.get('phone').touched }">
          <div class="invalid-feedback" *ngIf="editprofileform.get('phone').invalid && editprofileform.get('phone').touched">
            Please fill your phone
          </div>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" formControlName="username" class="form-control"
            [ngClass]="{ 'is-invalid': editprofileform.get('username').invalid && editprofileform.get('username').touched }">
          <div class="invalid-feedback" *ngIf="editprofileform.get('username').invalid && editprofileform.get('username').touched">
            Please fill your username
          </div>
        </div>

        <div class="form-group form-group-wide">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" class="form-control"
            [ngClass]="{ 'is-invalid': editprofileform.get('email').invalid && editprofileform.get('email').touched }">
          <div class="invalid-feedback" *ngIf="editprofileform.get('email').invalid && editprofileform.get('email').touched">
            Please fill your email
          </div>
        </div>
      </div>

      <div class="form-group upload-group">
        <label for="Picture">Profile Photo</label>
        <input id="Picture" type="file" class="form-control" (change)="onFileChange($event)" accept="image/*">
      </div>

      <div class="action-row">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
      </div>
    </form>
  </div>
</div>
